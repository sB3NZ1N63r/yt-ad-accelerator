<!DOCTYPE html>
<html lang="en">

<head>
  <title>YouTube Ad Accelerator</title>
  <meta charset="UTF-8" />
  <link href="css/options.css" rel="stylesheet" />
</head>

<body>
  <header class="header">
    <svg>
      <use href="#logo" />
    </svg>
    <h1 class="title">__MSG_appName__</h1>
    <div id="links">
      <a id="chrome-webstore" href="https://chrome.google.com/webstore/detail/yt-ad-accelerator/lnhnblhicjngnoddkojhdhebiccbfbfc" title="__MSG_chromeWebstore01__" target="_blank">
        <svg>
          <use href="#icon-webstore" />
        </svg>
      </a>
      <a id="github-link" href="https://github.com/Vatsalya-singhi/yt-ad-accelerator" title="GitHub" target="_blank">
        <svg>
          <use href="#icon-git" />
        </svg>
      </a>
      <a id="report-link" href="https://github.com/Vatsalya-singhi/yt-ad-accelerator/issues/new?labels=bug" target="_blank"
        title="__MSG_linkReport__" data-i18n>
        <svg>
          <use href="#icon-bug" />
        </svg>
      </a>
    </div>
  </header>

  <div class="update-notice" hidden>
    <p>__MSG_updateNotice__</p>
    <div class="update-links">
      <a class="latest-link button button--primary">__MSG_download__</a>
      <a class="button" href="https://github.com/Vatsalya-singhi/yt-ad-accelerator/releases" target="_blank" rel="noreferrer">
        __MSG_seeReleases__
        <svg>
          <use href="#icon-open-in-new" />
        </svg>
      </a>
    </div>
  </div>

  <div id="description">
    <span class="app-description">__MSG_appDescExtended__</span>
  </div>
  <div class="info">
    <span class="reload-notice">__MSG_reloadNotice__</span>
    <span class="saving-text" hidden>__MSG_saving__</span>
  </div>

  <div id="options-wrap">
    <form id="options-form" enctype="multipart/form-data">
      <fieldset class="form-group">
        <legend class="form-group-title">__MSG_optSkipAdByTitle__</legend>

        <label class="option-group">
          <input type="checkbox" name="skipAdByClick" value="yes" /> __MSG_optSkipAdByClick__
        </label>

      </fieldset>

      <fieldset class="form-group">
        <legend class="form-group-title">__MSG_optSkipWhenTitle__</legend>

        <div class="option-group">
          <label id="p-rate-min" title="playback rate min.">
            <input type="number" name="playbackRateMin" value="2" placeholder="1" min="1" max="16" step="0.5" />
            __MSG_optPlaybackRateMin__
          </label>
        </div>

        <div class="option-group">
          <label id="p-rate-max" title="playback rate max.">
            <input type="number" name="playbackRateMax" value="6" placeholder="16" min="2" max="16" step="0.5" />
            __MSG_optPlaybackRateMax__
          </label>
        </div>

        <div class="option-group">
          <label id="ad-duration-start" title="increase playback rate greater duration.">
            <input type="number" name="durationTrigger" value="20" placeholder="100" min="5" max="100" step="1.0" />
            __MSG_optDurationTrigger__
          </label>
        </div>
      </fieldset>

      <fieldset class="form-group">
        <label>
          <input type="checkbox" name="disabled" value="yes" /> __MSG_optDisable__
        </label>
      </fieldset>
    </form>
  </div>
